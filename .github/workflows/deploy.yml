name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          STATIC_BUILD: "1"
          # Project sites are served from /<repo-name>/; user/org sites from /.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          shell=dist/client/_shell.html
          [ -f "$shell" ] || shell=dist/client/index.html
          cp "$shell" dist/client/index.html
          cp "$shell" dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
